name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Нужно для перемещения тега nightly и перезаписи ассетов релиза
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Фронтенд собирается до бэкенда: результат уходит в go:embed
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Test
        run: go test ./...

      # Тег nightly не меняется, поэтому версия для сравнения — это commit sha
      - name: Prepare version
        run: |
          echo "VERSION=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build linux/amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}" \
            -o dist/go-offline ./cmd/go-offline

      - name: Build windows/amd64
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}" \
            -o dist/go-offline.exe ./cmd/go-offline

      # Манифест для проверки обновлений: качается как обычный файл,
      # без лимитов GitHub API на анонимные запросы. Ключи assets — это
      # GOOS/GOARCH, приложение выбирает свою строку само.
      - name: Write latest.json
        run: |
          linux_sha="$(sha256sum dist/go-offline | cut -d' ' -f1)"
          win_sha="$(sha256sum dist/go-offline.exe | cut -d' ' -f1)"
          cat > dist/latest.json <<JSON
          {
            "version": "${VERSION}",
            "built_at": "${BUILD_TIME}",
            "assets": {
              "linux/amd64":   {"file": "go-offline",     "sha256": "${linux_sha}"},
              "windows/amd64": {"file": "go-offline.exe", "sha256": "${win_sha}"}
            }
          }
          JSON
          cat dist/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: go-offline-linux-amd64
          path: dist/go-offline
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: go-offline-windows-amd64
          path: dist/go-offline.exe
          if-no-files-found: error

      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"

          # Тег фиксированный, поэтому переносим его на свежий коммит
          git tag -f nightly
          git push -f origin refs/tags/nightly

          notes="Автосборка из main, коммит ${short}, собрано ${BUILD_TIME}."

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "nightly (${short})" --notes "$notes" --latest
          else
            gh release create nightly --title "nightly (${short})" --notes "$notes" --latest --verify-tag
          fi

          # --clobber перезаписывает ассеты, не удаляя релиз,
          # поэтому ссылки для скачивания не пропадают между сборками
          gh release upload nightly \
            dist/go-offline dist/go-offline.exe dist/latest.json --clobber
