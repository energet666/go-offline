name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Фронтенд собирается до бэкенда: результат уходит в go:embed
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Test
        run: go test ./...

      - name: Build linux/amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o dist/go-offline ./cmd/go-offline

      - name: Build windows/amd64
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o dist/go-offline.exe ./cmd/go-offline

      - uses: actions/upload-artifact@v4
        with:
          name: go-offline-linux-amd64
          path: dist/go-offline
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: go-offline-windows-amd64
          path: dist/go-offline.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/go-offline
            dist/go-offline.exe
